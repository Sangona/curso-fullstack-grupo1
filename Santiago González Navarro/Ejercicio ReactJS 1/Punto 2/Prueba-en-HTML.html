<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de Componente de video</title>
</head>
<body>
    <h1>Prueba de video a través de props</h1>
    <div style="text-align: center; margin: 20px;">
        <h2>Video de Ejemplo: Heavensward Trailer</h2>
        <iframe
            width="80%"
            height="800"
            src="https://www.youtube.com/embed/4phUCJlomPo"
            title="Video de Ejemplo"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
        ></iframe>
    </div>
</body>
</html>
