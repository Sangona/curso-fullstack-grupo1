<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba AdivinaComponent</title>
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function AdivinaComponent() {
            const [numero, setNumero] = useState(1);
            const [sorteo, setSorteo] = useState(0);
            const [result, setResult] = useState(false);

            // Estados para contar jugadas, ganadas y perdidas
            const [jugadas, setJugadas] = useState(0);
            const [ganadas, setGanadas] = useState(0);
            const [perdidas, setPerdidas] = useState(0);

            const sortear = () => {
                const winner = Math.floor(Math.random() * 10) + 1;
                setSorteo(winner);
                setResult(true);

                // Actualizar conteos
                setJugadas(jugadas + 1);
                if (winner === Number(numero)) {
                    setGanadas(ganadas + 1);
                } else {
                    setPerdidas(perdidas + 1);
                }
            };

            return (
                <div style={{ margin: 30 }}>
                    {!result ? (
                        <div>
                            <h4>Adivina el Número del 1 al 10</h4>
                            <input
                                type="number"
                                value={numero}
                                onChange={(e) => setNumero(e.target.value)}
                            />
                            <br />
                            <button onClick={() => sortear()}>SORTEAR</button>
                        </div>
                    ) : (
                        <>
                            <hr />
                            <h3>Usted eligió el {numero}</h3>
                            <h3>Salió el número: {sorteo}</h3>
                            <h3 style={{ color: sorteo === Number(numero) ? 'green' : 'red' }}>
                                {sorteo === Number(numero) ? "Ha Ganado!" : "Siga participando"}
                            </h3>
                            <br />
                            <button
                                onClick={() => {
                                    setResult(false);
                                    setNumero(1);
                                }}
                            >
                                Volver a jugar
                            </button>
                            <hr />
                            <h4>Estadísticas:</h4>
                            <p>Jugadas: {jugadas}</p>
                            <p>Ganadas: {ganadas}</p>
                            <p>Perdidas: {perdidas}</p>
                        </>
                    )}
                </div>
            );
        }

        ReactDOM.render(<AdivinaComponent />, document.getElementById("root"));
    </script>
</body>
</html>
